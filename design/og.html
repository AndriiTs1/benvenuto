<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body { background: #F2F2F7; display: flex; align-items: center; justify-content: center; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { width: 1104px; height: 534px; background: #FFFFFF; border-radius: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .badge { background: #E9E9EE; border-radius: 999px; padding: 10px 26px; font-size: 26px; font-weight: 600; line-height: 1.2; }
  .green { color: #097236; } .red { color: #B3121F; } .dot { color: #5E5E63; }
  h1 { margin-top: 30px; font-size: 150px; font-weight: 700; letter-spacing: -0.045em; color: #1C1C1E; line-height: 1; }
  .line { margin-top: 40px; font-size: 32px; font-weight: 500; line-height: 1.2; }
  .sep { color: #8E8E93; }
</style></head>
<body><div class="card">
  <div class="badge"><span class="green">Italiano</span><span class="dot"> · </span><span class="red">A2</span></div>
  <h1>Benvenuto</h1>
  <div class="line"><span style="color:#005CB8">Grammatica</span><span class="sep"> · </span><span style="color:#006A7A">vocabolario</span><span class="sep"> · </span><span style="color:#8944AB">esercizi</span><span class="sep"> · </span><span style="color:#8F5100">comunicazione</span></div>
</div></body></html>
